<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juego Educativo: Tiempos Verbales</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --primary: #1565c0;      /* Azul vibrante */
      --primary-light: #42a5f5;
      --secondary: #ff9800;    /* Naranja energético */
      --accent: #00e676;       /* Verde brillante */
      --bg-gradient: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 50%, #90caf9 100%);
      --card-bg: #ffffff;
      --text-dark: #0d47a1;
      --text-muted: #1565c0;
      --shadow: 0 10px 25px rgba(21, 101, 192, 0.2);
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #2c3e50;
    }

    .container {
      width: 100%;
      max-width: 960px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 25px 30px;
      border: 4px solid #90caf9;
    }

    header {
      text-align: center;
      margin-bottom
